[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mveac"
version = "1.0.0"
description = "Multi-View Exploration-Aware Calibration for reducing informational concentration in news recommendation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Carolina Toledo Ferraz" },
    { name = "Marcelo Garcia Manzato" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "ortools>=9.7",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["mveac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
